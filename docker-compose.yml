# =============================================================================
# Docker Compose for ML Pipeline with MLflow and Airflow
# DDM501 - Lab 2: ML Pipeline & Experiment Tracking
#
# Services:
#   mlflow             - tracking server + model registry   -> localhost:5000
#   postgres           - Airflow metadata database
#   airflow-init       - one-shot db migrate + admin user
#   airflow-webserver  - Airflow UI                         -> localhost:8080
#   airflow-scheduler  - executes the DAG on its schedule
#   ml-pipeline        - on-demand pipeline / experiment runner (profile: tools)
#
# Usage:
#   cp .env.example .env      # then edit the keys
#   docker-compose up -d
#   docker-compose --profile tools run --rm ml-pipeline
# =============================================================================

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  image: ddm501/airflow-ml:2.8.0
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    # Point the pipeline at the MLflow service rather than localhost, which
    # inside a container would resolve to the container itself.
    MLFLOW_TRACKING_URI: http://mlflow:5000
    # Cache the MovieLens download so every task does not re-fetch it.
    SURPRISE_DATA_FOLDER: /opt/airflow/surprise_data
  volumes:
    # dags/ and pipeline/ are mounted (not copied) so edits are picked up
    # without rebuilding the image.
    - ./dags:/opt/airflow/dags
    - ./pipeline:/opt/airflow/pipeline
    - ./experiments:/opt/airflow/experiments
    - ./logs:/opt/airflow/logs
    - ./models:/opt/airflow/models
    - ./artifacts:/opt/airflow/artifacts
    - surprise_data:/opt/airflow/surprise_data
  depends_on: &airflow-common-depends
    postgres:
      condition: service_healthy
  networks:
    - mlops-network

services:
  # ===========================================================================
  # MLflow Tracking Server + Model Registry
  # ===========================================================================
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.9.2
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      # Directory mounts (not file mounts): bind-mounting a not-yet-existing
      # mlflow.db file makes Docker create a *directory* with that name and
      # SQLite then fails to open it.
      - ./mlruns:/mlflow/mlruns
      - ./mlflow-db:/mlflow/db
    command: >
      sh -c "pip install --no-cache-dir psycopg2-binary >/dev/null 2>&1;
      mlflow server
      --backend-store-uri sqlite:////mlflow/db/mlflow.db
      --serve-artifacts
      --artifacts-destination /mlflow/mlruns
      --host 0.0.0.0
      --port 5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - mlops-network

  # ===========================================================================
  # PostgreSQL Database (for Airflow)
  # ===========================================================================
  postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - mlops-network

  # ===========================================================================
  # Airflow Initialization (one-shot)
  # ===========================================================================
  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    # Root is needed once to fix ownership of the bind-mounted host folders,
    # which otherwise belong to the host user and are unwritable by `airflow`.
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/models /opt/airflow/artifacts /opt/airflow/surprise_data
        chown -R "50000:0" /opt/airflow/logs /opt/airflow/models /opt/airflow/artifacts /opt/airflow/surprise_data
        su airflow -c "airflow db migrate && \
          airflow users create \
            --username admin --password admin \
            --firstname Admin --lastname User \
            --role Admin --email admin@example.com || true"
    restart: "no"

  # ===========================================================================
  # Airflow Webserver
  # ===========================================================================
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ===========================================================================
  # Airflow Scheduler
  # ===========================================================================
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    depends_on:
      <<: *airflow-common-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ===========================================================================
  # ML Pipeline runner (on demand, not part of `up`)
  # ===========================================================================
  # Guarded behind a compose profile so `docker-compose up` starts only the
  # long-running services. Run it explicitly:
  #   docker-compose --profile tools run --rm ml-pipeline
  #   docker-compose --profile tools run --rm ml-pipeline python -m experiments.run_experiments
  ml-pipeline:
    build:
      context: .
      dockerfile: Dockerfile
    image: ddm501/ml-pipeline:latest
    container_name: ml-pipeline
    profiles: ["tools"]
    volumes:
      - ./pipeline:/app/pipeline
      - ./experiments:/app/experiments
      - ./models:/app/models
      - ./artifacts:/app/artifacts
      - surprise_data:/root/.surprise_data
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      SURPRISE_DATA_FOLDER: /root/.surprise_data
    depends_on:
      mlflow:
        condition: service_healthy
    command: python -m pipeline.run_pipeline
    networks:
      - mlops-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
  surprise_data:

# =============================================================================
# Networks
# =============================================================================
networks:
  mlops-network:
    driver: bridge
